<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Comments Closed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <img src="icons/icon-48.png" width="48" height="48" alt="">
  <h1>Comments, on your terms.</h1>
  <p>Comments, Description, and Ask side panels start closed so the video gets the full screen. Click any button or <strong>Show comments</strong> to open them.</p>
  <form id="settings-form">
    <fieldset>
      <legend>When moving to a new video</legend>
      <label for="mode-always-closed" class="option-label">
        <input type="radio" id="mode-always-closed" name="panelMode" value="always-closed" class="visually-hidden" checked>
        <span><strong>Always start closed</strong> — start every video with Comments, Description, and Ask closed</span>
      </label>
      <label for="mode-remember" class="option-label">
        <input type="radio" id="mode-remember" name="panelMode" value="remember" class="visually-hidden">
        <span><strong>Remember open panel</strong> — keep your opened panel across videos until you close it</span>
      </label>
    </fieldset>
  </form>
  <footer>YouTube Comments Closed · 1.1.3</footer>
  <script src="popup.js"></script>
</body>
</html>
